name: gopher_jobs
description: Paste a job URL and source material to generate an ATS-optimized resume and cover letter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  html: ^0.15.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  file_picker: ^8.3.7
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
